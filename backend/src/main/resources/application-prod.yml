spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ofni}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:ofni}
    password: ${DATABASE_PASSWORD:ofni}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false
