[project]
name = "ofni-ai-models"
version = "0.1.0"
description = "Training and export scripts for OFNI-MAKER classification models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "onnx>=1.15.0",
    "onnxsim>=0.4.36",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.2",
    "pillow>=10.2.0",
    "numpy>=1.26.4",
    "timm>=1.0.26",
    "onnxruntime>=1.24.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.hatch.build.targets.wheel]
packages = ["training"]
