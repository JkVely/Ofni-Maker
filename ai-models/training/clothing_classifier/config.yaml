# config.yaml
# Configuraciones para el entrenamiento del modelo MobileNetV3

dataset:
  path: "./data/deepfashion2"
  batch_size: 32
  num_workers: 4

model:
  name: "timm/mobilenetv4_hybrid_medium.e500_r224_in1k"
  num_classes: 13 # 13 categorias oficiales de DeepFashion2

training:
  epochs: 32
  learning_rate: 0.00005
  weight_decay: 0.0001
  checkpoint_dir: "./checkpoints"

export:
  onnx_opset: 14
  image_size: 224
